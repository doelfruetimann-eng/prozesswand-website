/* KI-Dialog pro Aufgabe – Anweisungen geben, KI passt an */
async function cardAI(id) {
  const c = getPostit(id); if (!c) return;
  if (!kiBereit()) { openKeyModal(() => cardAI(id)); return; }
  const row = lupeBody.querySelector('.tk[data-id="' + id + '"]');
  if (!row) return;
  const existing = row.nextElementSibling;
  if (existing && existing.classList.contains('tk-ai-box')) { existing.remove(); return; } // Toggle
  const box = document.createElement('div');
  box.className = 'tk-ai-box';
  box.innerHTML = '<div class="tk-ai-msgs"></div>'
    + '<div class="tk-ai-in"><textarea rows="2" placeholder="Anweisung an die KI, z.B. «bitte Antragsformular verwenden» …"></textarea><button class="send">Senden</button></div>'
    + '<div class="row"><button class="take">Letzte Antwort als Ergebnis übernehmen</button><button class="drop">Einklappen</button><button class="wipe" style="background:#b14b46;color:#fff">Verlauf löschen</button></div>';
  row.after(box);
  const p = state.phases[lupeIdx];
  const sys = 'Du bist ein Fach-Assistent in einer Projekt-Prozesswand (Systems Engineering). Du arbeitest eine einzelne Aufgabe konkret aus und passt sie auf Anweisung des Nutzers an (z.B. bestimmte Formulare, Vorlagen, Adressaten oder Detailtiefe). Kurz, praxisnah, auf Deutsch. Kein Vorgeplänkel.\nFür Dokumente/Vorlagen gilt immer diese Standard-Anweisung des Nutzers: ' + docStyle();
  const dlg = Array.isArray(c.chat) ? c.chat.slice() : [];
  let lastAnswer = ''; for (let i = dlg.length - 1; i >= 0; i--) { if (dlg[i].role === 'ai') { lastAnswer = dlg[i].text; break; } }
  const msgsEl = box.querySelector('.tk-ai-msgs');
  const inEl = box.querySelector('textarea');
  const renderDlg = () => { msgsEl.innerHTML = dlg.map(m => '<div class="am ' + m.role + '">' + esc(m.text) + '</div>').join(''); msgsEl.scrollTop = msgsEl.scrollHeight; };
  const persist = think => { c.chat = dlg.filter(m => m !== think && !(m.text||'').startsWith('❌')).slice(-20); save(); };
  async function send(instr) {
    dlg.push({ role:'user', text: instr }); const think = { role:'ai', text:'… denkt nach …' }; dlg.push(think); renderDlg();
    try {
      const hist = 'Projektziel: ' + (state.goal||'-') + '\nPhase: ' + p.name + '\nAufgabe: "' + c.text + '"\n\n'
        + dlg.filter(m => m !== think).map(m => (m.role==='user' ? 'Anweisung: ' : 'Assistent: ') + m.text).join('\n\n');
      const out = await callClaude(sys, hist, CHAT_MODEL, 1100);
      dlg.splice(dlg.indexOf(think), 1); dlg.push({ role:'ai', text: out }); lastAnswer = out; renderDlg(); persist();
    } catch (e) { dlg.splice(dlg.indexOf(think), 1); dlg.push({ role:'ai', text:'❌ ' + e.message }); renderDlg(); persist(); }
  }
  box.querySelector('.send').onclick = () => { const v = inEl.value.trim(); if (!v) return; inEl.value = ''; send(v); };
  inEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); box.querySelector('.send').click(); } });
  box.querySelector('.drop').onclick = () => { box.remove(); renderLupe(); };
  box.querySelector('.wipe').onclick = () => {
    if (!box.dataset.arm) { box.dataset.arm = '1'; box.querySelector('.wipe').textContent = 'Wirklich löschen?'; return; }
    delete c.chat; save(); box.remove(); renderLupe();
  };
  box.querySelector('.take').onclick = () => {
    if (!lastAnswer) return;
    const first = lastAnswer.split('\n').find(l => l.trim()) || lastAnswer;
    const nc = addCard(lupeIdx, 'doku', '📄 ' + first.slice(0, 140).replace(/^[-•#\d.\s]+/, ''), 'offen');
    nc.doc = lastAnswer; // kompletter Text bleibt in der Karte gespeichert
    save(); renderLupe(); render();
    sysMsg('📄 Ausarbeitung auf der Dokumentationsebene gespeichert – Download über das 📥-Symbol in der Lupe.', true);
  };
  renderDlg();
  if (!dlg.length) send('Bitte diese Aufgabe konkret ausarbeiten: Teilschritte, erwartetes Ergebnis, worauf achten.');
}

/* Phasen-Analyse-Tools (mit Freigabe) */
async function phaseTool(kind) {
  const prop = document.getElementById('lupeProp');
  const p = state.phases[lupeIdx];
  document.querySelectorAll('.lupe-tool').forEach(b => b.disabled = true);
  if (!kiBereit()) { document.querySelectorAll('.lupe-tool').forEach(b => b.disabled = false); openKeyModal(() => phaseTool(kind)); return; }
  const ctx = 'Projektziel: ' + (state.goal||'-') + '\nPhase ' + (lupeIdx+1) + ': ' + p.name
    + '\nBereits vorhanden – Schritte: ' + cardsInPhaseLane(lupeIdx,'handlung').map(c=>c.text).join('; ')
    + ' | Risiken: ' + cardsInPhaseLane(lupeIdx,'reflexion').map(c=>c.text).join('; ')
    + ' | Anspruchsgruppen: ' + cardsInPhaseLane(lupeIdx,'anspruch').map(c=>c.text).join('; ');
  try {
    if (kind === 'zusammenfassung') {
      prop.style.display = 'block'; prop.innerHTML = '🤖 fasst zusammen …';
      const out = await callClaude('Du bist Projektmoderator. Fasse den Stand dieser Phase in 4–6 Sätzen zusammen: Ziel, Vorgehen, offene Punkte, Risiken. Deutsch, sachlich.', ctx + '\n\n' + wallContext(), CHAT_MODEL, 700);
      prop.innerHTML = '<h4>Zusammenfassung Phase ' + (lupeIdx+1) + '</h4><div style="font-size:12.5px;white-space:pre-wrap">' + esc(out) + '</div><div class="row"><button class="drop">Schliessen</button></div>';
      prop.querySelector('.drop').onclick = () => { prop.style.display = 'none'; };
      return;
    }
    const cfgKind = {
      schritte:  { lane:'handlung', label:'Schritte / Aufgaben', prefix:'', sys:'Nenne bis zu 5 zusätzliche, konkrete Arbeitsschritte für diese Phase, die noch fehlen. Keine Wiederholungen.' },
      risiken:   { lane:'reflexion', label:'Risiken (Pre-Mortem)', prefix:'⚠️ ', sys:'Führe ein Pre-Mortem durch: nenne bis zu 5 konkrete Risiken/Fehlerquellen dieser Phase, die noch nicht genannt sind.' },
      anspruch:  { lane:'anspruch', label:'Anspruchsgruppen', prefix:'👥 ', sys:'Nenne bis zu 5 betroffene oder fehlende Anspruchsgruppen/Stakeholder dieser Phase, die noch nicht genannt sind.' }
    }[kind];
    prop.style.display = 'block'; prop.innerHTML = '🤖 erarbeitet Vorschläge …';
    const data = await (async () => {
      const sys = cfgKind.sys + '\nAntworte AUSSCHLIESSLICH als JSON: {"items":["...","..."]}';
      const t = await callClaude(sys, ctx, CHAT_MODEL, 800);
      return extractJSON(t);
    })();
    const items = (data.items || []).filter(x => typeof x === 'string' && x.trim()).slice(0, 6);
    if (!items.length) { prop.innerHTML = '<h4>Keine neuen Vorschläge.</h4><div class="row"><button class="drop">Schliessen</button></div>'; prop.querySelector('.drop').onclick = () => prop.style.display='none'; return; }
    prop.innerHTML = '<h4>Vorschläge: ' + cfgKind.label + ' (auswählen &amp; übernehmen)</h4>'
      + items.map((t, j) => '<label><input type="checkbox" checked data-j="' + j + '"><span>' + esc(t) + '</span></label>').join('')
      + '<div class="row"><button class="take">Übernehmen</button><button class="drop">Verwerfen</button></div>';
    prop.querySelector('.drop').onclick = () => { prop.style.display = 'none'; };
    prop.querySelector('.take').onclick = () => {
      prop.querySelectorAll('input[type=checkbox]').forEach(cb => { if (cb.checked) addCard(lupeIdx, cfgKind.lane, cfgKind.prefix + items[+cb.dataset.j], 'offen'); });
      prop.style.display = 'none'; save(); renderLupe(); render();
    };
  } catch (e) {
    prop.style.display = 'block'; prop.innerHTML = '❌ ' + esc(e.message) + '<div class="row"><button class="drop">Schliessen</button></div>';
    prop.querySelector('.drop').onclick = () => prop.style.display = 'none';
  } finally {
    document.querySelectorAll('.lupe-tool').forEach(b => b.disabled = false);
  }
}

  authGate.style.display = 'none';
  await loadFromCloud();
  startAutoAnzeigen();
}
async function initAuth() {
  /* Übungs-Modus (V58): ?beispiel öffnet die Wand ohne Anmeldung mit dem
     Beispielprojekt – für Besucher von prozesswand.ch. Gespeichert wird nur
     lokal auf dem Gerät; fürs richtige Speichern braucht es ein Konto. */
  if (new URLSearchParams(location.search).has('beispiel')) {
    loadCollection(null);
    ladeBeispiel();
    document.getElementById('pvNeu').click();
    state.goal = 'Bis Ende Oktober 2026 verwandeln wir die Brachfläche in einen Gemeinschaftsgarten mit 20 Beeten – eröffnet mit einem Quartierfest.';
    goalInput.value = state.goal; autoResizeGoal(); save(); render();
    sysMsg('🧪 Übungs-Modus: Das Beispielprojekt «Quartier-Gemeinschaftsgarten» ist geladen – klick dich frei durch, kaputt geht nichts. Alles bleibt nur auf diesem Gerät. Zum richtigen Speichern: Seite ohne Zusatz öffnen und ein Konto erstellen.', true);
    return;
  }
  if (!window.supabase) {
    let local = null; try { local = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
    loadCollection(local);
    showAuth('Keine Verbindung zum Anmelde-Dienst. Internetverbindung prüfen und Seite neu laden.');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  loadCollection(null);
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) { startApp(data.session.user); return; }
  } catch (e) {}
  showAuth('');
}
document.getElementById('authSubmit').onclick = async () => {
  const email = document.getElementById('authEmail').value.trim();
  const pw = document.getElementById('authPw').value;
  const err = document.getElementById('authErr');
  err.textContent = '';
  if (!sb) { err.textContent = 'Keine Verbindung zum Anmelde-Dienst.'; return; }
  if (!email || !pw) { err.textContent = 'Bitte E-Mail und Passwort eingeben.'; return; }
  const register = document.getElementById('authForm').dataset.mode === 'register';
  try {
    if (register) {
      const { data, error } = await sb.auth.signUp({ email, password: pw });
      if (error) throw error;
      if (data.session) startApp(data.session.user);
      else err.textContent = 'Konto erstellt – bitte E-Mail bestätigen, dann anmelden.';
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
      startApp(data.user);
    }
  } catch (e) { err.textContent = e.message || String(e); }
};
document.getElementById('authToggle').onclick = () => {
  const f = document.getElementById('authForm');
  const toRegister = f.dataset.mode !== 'register';
  f.dataset.mode = toRegister ? 'register' : 'login';
  document.getElementById('authTitle').textContent = toRegister ? 'Konto erstellen' : 'Anmelden';
  document.getElementById('authSubmit').textContent = toRegister ? 'Registrieren' : 'Anmelden';
  document.getElementById('authToggle').textContent = toRegister ? 'Schon ein Konto? Anmelden' : 'Neues Konto erstellen';
  document.getElementById('authErr').textContent = '';
};
document.getElementById('authPw').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('authSubmit').click();
});
document.getElementById('logoutBtn').onclick = async () => {
  try { if (sb) await sb.auth.signOut(); } catch (e) {}
  location.reload();
};

/* ================================================================
   DIKTIEREN (V48): 🎤 erscheint bei jedem Textfeld (Web Speech API,
   eingebaut im Browser – keine neue Abhängigkeit, kein Server).
   Erkanntes wird an der Schreibmarke des zuletzt aktiven Felds eingefügt.
   ================================================================ */
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return; // Browser ohne Spracheingabe: Knopf erscheint gar nicht
  const micBtn = document.createElement('button');
  micBtn.id = 'micBtn'; micBtn.type = 'button';
  micBtn.innerHTML = '&#127908;';
  micBtn.title = 'Diktieren – klicken zum Starten/Stoppen (Spracheingabe des Browsers)';
  document.body.appendChild(micBtn);
  let ziel = null, rec = null, aktiv = false;
  const passt = el => el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'search'))) && !el.readOnly && !el.disabled;
  function zeigen(el) {
    ziel = el;
    const r = el.getBoundingClientRect();
    micBtn.style.display = 'flex';
    micBtn.style.left = Math.max(4, Math.min(window.innerWidth - 32, r.right - 32)) + 'px';
    micBtn.style.top = Math.max(4, r.top - 13) + 'px';
  }
  document.addEventListener('focusin', e => { if (passt(e.target)) zeigen(e.target); });
  document.addEventListener('focusout', () => { setTimeout(() => { if (!aktiv && document.activeElement !== micBtn && !passt(document.activeElement)) micBtn.style.display = 'none'; }, 250); });
  window.addEventListener('scroll', () => { if (!aktiv) micBtn.style.display = 'none'; }, true);
  function einfuegen(txt) {
    if (!ziel || !txt) return;
    const a = ziel.selectionStart != null ? ziel.selectionStart : ziel.value.length;
    const b = ziel.selectionEnd != null ? ziel.selectionEnd : a;
    const vor = ziel.value.slice(0, a);
    const glatt = (vor && !/\s$/.test(vor) ? ' ' : '') + txt.trim();
    ziel.value = vor + glatt + ziel.value.slice(b);
    ziel.selectionStart = ziel.selectionEnd = a + glatt.length;
    ziel.dispatchEvent(new Event('input', { bubbles: true }));
  }
  micBtn.addEventListener('pointerdown', e => e.preventDefault()); // Fokus bleibt im Textfeld
  micBtn.onclick = () => {
    if (aktiv) { try { rec.stop(); } catch (e) {} return; }
    rec = new SR();
    rec.lang = 'de-CH'; rec.continuous = true; rec.interimResults = false;
    rec.onresult = ev => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) einfuegen(ev.results[i][0].transcript);
      }
    };
    rec.onend = () => { aktiv = false; micBtn.classList.remove('an'); };
    rec.onerror = ev => {
      aktiv = false; micBtn.classList.remove('an');
      if (ev.error === 'not-allowed') sysMsg('🎤 Mikrofon nicht erlaubt – bitte in den Browser-Einstellungen für diese Seite freigeben.', true);
    };
    try { rec.start(); aktiv = true; micBtn.classList.add('an'); } catch (e) {}
  };
})();

document.getElementById('verTag').textContent = APP_VERSION;
document.title = 'OSTO/SYMA Prozesswand ' + APP_VERSION;
initAuth();
