/* Umfrage-Auswertung als Klartext für die Anzeige im Fenster (T-016) */
function umfrageText(rows, umfrageId) {
  const titel = (rows[0] && rows[0].titel) || umfrageId;
  let t = 'Umfrage «' + titel + '» – ' + rows.length + ' Antwort(en)\n';
  const fragen = [];
  rows.forEach(r => (r.antworten || []).forEach(a => { if (a.frage && !fragen.includes(a.frage)) fragen.push(a.frage); }));
  fragen.forEach((f, fi) => {
    const antw = [];
    rows.forEach(r => { const a = (r.antworten || []).find(x => x.frage === f); if (a && String(a.antwort || '').trim()) antw.push({ w: String(a.antwort).trim(), n: r.name || '' }); });
    t += '\n' + (fi + 1) + '. ' + f + '\n';
    const z = antw.map(a => parseFloat(a.w)).filter(n => !isNaN(n));
    if (z.length === antw.length && z.length) t += '   Durchschnitt: ' + (Math.round(z.reduce((s, n) => s + n, 0) / z.length * 10) / 10) + '  (' + z.join(', ') + ')\n';
    else antw.forEach(a => { t += '   – ' + a.w + (a.n ? '  (' + a.n + ')' : '') + '\n'; });
  });
  return t;
}

/* Umfrage-Auswertung (ab V42): rein aus den Supabase-Zeilen, kein LLM */
function genUmfrageDoc(rows, umfrageId) {

    + '</table>';
  const fragen = [];
  rows.forEach(r => (r.antworten || []).forEach(a => { if (a.frage && !fragen.includes(a.frage)) fragen.push(a.frage); }));
  fragen.forEach((f, fi) => {
    const antworten = [];
    rows.forEach(r => {

    if (zahlen.length === antworten.length && zahlen.length) {
      const schnitt = Math.round(zahlen.reduce((s, n) => s + n, 0) / zahlen.length * 10) / 10;
      b += '<p><b>Durchschnitt: ' + schnitt + '</b> (' + antworten.length + ' Antworten: ' + zahlen.join(', ') + ')</p>';

/* ================================================================
   TERMIN-EINLADUNG (.ics) mit Thema und Traktanden (T-018)
   Kein Versand: Datei wird nur erzeugt – einladen tut der Nutzer selbst.
   ================================================================ */
function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) { // RFC 5545: Zeilen über 74 Zeichen umbrechen (Fortsetzung mit Leerzeichen)
  let out = '';
  while (line.length > 74) { out += line.slice(0, 74) + '\r\n '; line = line.slice(74); }
  return out + line;
}
function makeIcs(o) { // o: {titel, traktanden, ort, link, datum:'YYYY-MM-DD', zeit:'HH:MM', dauerMin}
  const d = (o.datum || '').replace(/-/g, ''), z = (o.zeit || '10:00').replace(':', '');
  const start = d + 'T' + z + '00';
  const sm = parseInt(z.slice(0, 2), 10) * 60 + parseInt(z.slice(2), 10) + (parseInt(o.dauerMin, 10) || 30);
  const ende = d + 'T' + ('0' + Math.floor(sm / 60) % 24).slice(-2) + ('0' + sm % 60).slice(-2) + '00';
  const jetzt = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  let besch = o.traktanden ? 'Traktanden:\n' + o.traktanden : '';
  if (o.link) besch += (besch ? '\n\n' : '') + 'Link: ' + o.link;
  const zeilen = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Prozesswand//' + APP_VERSION + '//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT', 'UID:' + uid('ev') + '@prozesswand', 'DTSTAMP:' + jetzt, 'DTSTART:' + start, 'DTEND:' + ende,
    'SUMMARY:' + icsEscape(o.titel || 'Termin')];
  if (besch) zeilen.push('DESCRIPTION:' + icsEscape(besch));
  if (o.ort) zeilen.push('LOCATION:' + icsEscape(o.ort));
  if (o.link) zeilen.push('URL:' + icsEscape(o.link));
  zeilen.push('END:VEVENT', 'END:VCALENDAR');
  return zeilen.map(icsFold).join('\r\n');
}
function downloadIcs(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/calendar' }));
  a.download = name.replace(/[\\/:*?"<>|]/g, '-') + '.ics';
  a.click(); URL.revokeObjectURL(a.href);
}

function b64uEnc(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
/* T-021: Vermittler-Dienst für dynamische KI-Umfragen – der Anthropic-Schlüssel liegt NUR dort
   als Server-Geheimnis (Anleitung: docs/supabase-edge-ki-umfrage.md), nie im Browser der Befragten. */
const KI_UMFRAGE_URL = 'https://bvbjxofdcugpfsccwlzv.supabase.co/functions/v1/hyper-worker'; // Name der von Dölf angelegten Funktion (28.07.2026)
function umfrageUrl(def) { return new URL('umfrage.html', location.href).href.split('?')[0] + '?u=' + b64uEnc(JSON.stringify(def)); }
function umfrageIdAus(titel) { return titel.toLowerCase().replace(/[^a-z0-9äöü]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) + '-' + Math.random().toString(36).slice(2, 6); }
function parseFragen(text) { // gleiche Syntax wie umfrage.html: «Frage | skala» / «| wahl: A; B» / Text
  return text.split('\n').map(z => z.trim()).filter(Boolean).map(z => {
    const m = z.split('|'); const f = m[0].trim(); const zusatz = (m[1] || '').trim().toLowerCase();
    if (zusatz.startsWith('skala')) return { f, typ: 'skala' };
    if (zusatz.startsWith('wahl')) return { f, typ: 'wahl', o: (m[1].split(':')[1] || '').split(';').map(x => x.trim()).filter(Boolean) };
    return { f, typ: 'text' };
  });
}

function befPersonen(bef) { // Empfänger live aus den verknüpften Anspruchsgruppen-Karten
  const out = [];

let befCache = {}; // umfrage_id → Zeilen aus Supabase (nur im Speicher, nie gespeichert)
async function befLaden() {
  if (!sb) throw new Error('Keine Verbindung zu Supabase – bitte zuerst anmelden.');
  for (const bef of (state.befragungen || [])) {
    const { data, error } = await sb.from('umfrage_antworten').select('*').eq('umfrage_id', bef.umfrageId).order('created_at');
    if (!error) befCache[bef.umfrageId] = data || [];
  }
}
function befHatGeantwortet(bef, name) {
  const rows = befCache[bef.umfrageId] || [];
  const n = (name || '').trim().toLowerCase();
  const r = rows.find(x => (x.name || '').trim().toLowerCase() === n && n);
  return r ? (r.created_at || '').slice(0, 10) : null;
}
function befGruppenAuswertung(bef) { // Auswertung je Anspruchsgruppe (Durchschnitt, Häufungen) – ohne LLM
  const rows = befCache[bef.umfrageId] || [];
  if (!rows.length) return 'Noch keine Antworten eingegangen.';
  const pers = befPersonen(bef);
  const gruppeVon = name => { const p = pers.find(x => x.name.toLowerCase() === (name || '').trim().toLowerCase()); return p ? p.gruppe : '(ohne Zuordnung)'; };
  const gruppen = [...new Set(rows.map(r => gruppeVon(r.name)))];
  let t = 'Befragung «' + bef.titel + '» – ' + rows.length + ' Antwort(en), ' + gruppen.length + ' Gruppe(n)\n';
  const fragen = [];
  rows.forEach(r => (r.antworten || []).forEach(a => { if (a.frage && !fragen.includes(a.frage)) fragen.push(a.frage); }));
  fragen.forEach((f, fi) => {
    t += '\n' + (fi + 1) + '. ' + f + '\n';
    gruppen.forEach(g => {
      const antw = [];
      rows.forEach(r => {
        if (gruppeVon(r.name) !== g) return;
        const a = (r.antworten || []).find(x => x.frage === f);
        if (a && String(a.antwort || '').trim()) antw.push(String(a.antwort).trim());
      });
      if (!antw.length) return;
      const z = antw.map(w => parseFloat(w)).filter(n => !isNaN(n));
      if (z.length === antw.length && z.length) {
        t += '   ' + g + ': Durchschnitt ' + (Math.round(z.reduce((s, n) => s + n, 0) / z.length * 10) / 10) + ' (' + z.join(', ') + ')\n';
      } else {
        const zaehl = {};
        antw.forEach(w => { zaehl[w] = (zaehl[w] || 0) + 1; });
        const kurz = Object.keys(zaehl).length <= 4 && antw.every(w => w.length <= 30);
        if (kurz) t += '   ' + g + ': ' + Object.entries(zaehl).sort((a, b) => b[1] - a[1]).map(([w, n]) => w + ' (' + n + '×)').join(', ') + '\n';
        else antw.forEach(w => { t += '   ' + g + ': ' + w + '\n'; });
      }
    });
  });
  return t;
}
function neueBefragung(o) { // {titel, intro, fragen, gruppen, frist, quelle, fkRound, ki}
  const id = umfrageIdAus(o.titel);
  const def = { id, t: o.titel, i: o.intro || '', q: o.fragen };
  if (o.ki) { def.ki = KI_UMFRAGE_URL; def.max = 6; }
  const bef = { id: uid('bef'), umfrageId: id, titel: o.titel, intro: o.intro || '', link: umfrageUrl(def),
    fragen: o.fragen.map(q => q.f), gruppen: o.gruppen || [], frist: o.frist || '', quelle: o.quelle || 'dashboard',
    erstellt: new Date().toISOString().slice(0, 10), annahmen: {} };
  if (o.fkRound) bef.fkRound = o.fkRound;
  if (!Array.isArray(state.befragungen)) state.befragungen = [];
  state.befragungen.push(bef); save();
  return bef;
}

/* Abschlussbericht (T-004): deterministisch aus den Karten – leere Abschnitte werden weggelassen (Regel B) */
function genAbschluss() {
  const done = c => (c.status || 'offen') === 'erledigt';
  const laneCards = k => state.postits.filter(c => laneKeyOfY(c.y) === k);
  const alleTasks = [];
  state.phases.forEach((p, i) => tasksOfPhase(i).forEach(c => alleTasks.push(c)));
  const erled = alleTasks.filter(done).length;
  const pct = alleTasks.length ? Math.round(erled / alleTasks.length * 100) : 0;
  let firstOpen = state.phases.length;
  for (let i = 0; i < state.phases.length; i++) {
    const t = tasksOfPhase(i);
    if (!t.length || t.some(c => !done(c))) { firstOpen = i; break; }
  }
  let n2 = 0; const num = () => { n2++; return n2 + '. '; };
  let b = '<table class="kopf">'
    + kopfRow('Projekt', boardName())
    + kopfRow('Berichtsart', erled === alleTasks.length && alleTasks.length ? 'Abschlussbericht' : 'Zwischenbericht (Projekt läuft)')
    + kopfRow('Stand', heute() + ', direkt aus der Prozesswand')
    + kopfRow('Fortschritt', alleTasks.length ? erled + ' von ' + alleTasks.length + ' Aufgaben erledigt (' + pct + ' %)' : '')
    + '</table>';
  if (state.goal) b += '<h2>' + num() + 'Gesamtziel</h2><p>' + esc(state.goal) + '</p>';
  if (state.milestones.length) {
    b += '<h2>' + num() + 'Entscheid-Tore</h2><table><tr><th>Tor</th><th style="width:90pt">Status</th><th style="width:80pt">Zieldatum</th></tr>';
    state.milestones.forEach(m => {
      const pi = phaseIndexOfX(clamp(m.x - 2, 0, canvasW(state) - 1));
      const erreicht = pi < firstOpen;
      b += '<tr><td>' + esc(m.label.split(/\s[–-]\sKriterien/)[0]) + '</td><td>' + (erreicht ? 'erreicht' : 'offen') + '</td><td>' + (m.due ? fmtDue(m.due) : '') + '</td></tr>';
    });
    b += '</table>';
  }
  b += '<h2>' + num() + 'Phasen im Überblick</h2><table><tr><th style="width:36pt">Phase</th><th style="width:150pt">Bezeichnung</th><th style="width:90pt">Aufgaben</th><th>Ergebnisse (Dokumentations-Ebene)</th></tr>';
  state.phases.forEach((p, i) => {
    const t = tasksOfPhase(i);
    const dok = laneCards('doku').filter(c => phaseIndexOfX(c.x) === i).map(c => cleanTxt(c.text)).join('; ');
    b += '<tr><td class="c">' + (i+1) + '</td><td><b>' + esc(p.name) + '</b></td><td class="c">' + t.filter(done).length + ' / ' + t.length + '</td><td>' + esc(cutAtSentence(dok, 220)) + '</td></tr>';
  });
  b += '</table>';
  const zieleErr = laneCards('sache').filter(done).map(c => cleanTxt(c.text));
  if (zieleErr.length) b += '<h2>' + num() + 'Erreichte Zwischenziele</h2><ul>' + zieleErr.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>';
  const offen = alleTasks.filter(c => !done(c));
  if (offen.length) {
    b += '<h2>' + num() + 'Offene Aufgaben</h2><table><tr><th>Aufgabe</th><th style="width:80pt">Status</th><th style="width:90pt">Braucht</th></tr>';
    offen.forEach(c => {
      const ty = taskTyp(c);
      b += '<tr><td>' + esc(cleanTxt(c.text)) + '</td><td>' + exportStatus(c).label + '</td><td>' + (ty === 'freigabe' ? 'Freigabe' : ty === 'input' ? 'Input Mensch' : '–') + '</td></tr>';
    });
    b += '</table>';
  }
  const risiken = laneCards('reflexion').map(c => cleanTxt(c.text));
  if (risiken.length) b += '<h2>' + num() + 'Risiken und Reflexion</h2><ul>' + risiken.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>';
  return docShell('Abschlussbericht', b);
}

/* Architektur-Landkarte: ganze Wand als SVG/PNG – deterministisch, ohne KI */
function genLandkarte() {
  const TOP = 34, FOOT = 44;
  const W = LABEL_W + canvasW(state), H = TOP + HEADER_H + LANES.length * LANE_H + FOOT;
  const tspan = (t, n) => esc((t || '').slice(0, n));
  let s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" font-family="Helvetica,Arial,sans-serif">';
  s += '<defs><marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fae"/></marker></defs>';
  s += '<rect width="100%" height="100%" fill="#ffffff"/>';
  s += '<text x="12" y="22" font-size="16" font-weight="bold" fill="#651B32">' + tspan(boardName(), 60) + ' &#183; Architektur-Landkarte</text>';
  s += '<text x="' + (W - 12) + '" y="22" font-size="10" fill="#666666" text-anchor="end">Prozesswand &#183; ' + heute() + '</text>';
  /* Ebenen */
  LANES.forEach((l, i) => {
    const y = TOP + HEADER_H + i * LANE_H;
    s += '<rect x="0" y="' + y + '" width="' + W + '" height="' + LANE_H + '" fill="' + (i % 2 ? '#fafbfd' : '#ffffff') + '" stroke="#e2e5ea" stroke-width="1"/>';
    s += '<rect x="0" y="' + y + '" width="' + LABEL_W + '" height="' + LANE_H + '" fill="#f4f6f9" stroke="#d5dae1"/>';
    s += '<text x="10" y="' + (y + 18) + '" font-size="10.5" font-weight="bold" fill="#333333">' + tspan(laneTitle(l), 24) + '</text>';
  });
  /* Phasen */
  state.phases.forEach((p, i) => {
    const x = LABEL_W + phaseLeft(i);
    s += '<rect x="' + x + '" y="' + TOP + '" width="' + p.w + '" height="' + HEADER_H + '" fill="#F3EBEE" stroke="#d8c3ca"/>';
    s += '<text x="' + (x + 8) + '" y="' + (TOP + 24) + '" font-size="12" font-weight="bold" fill="#651B32">' + tspan(p.name, Math.floor(p.w / 7)) + '</text>';
    s += '<text x="' + (x + 8) + '" y="' + (TOP + 42) + '" font-size="9" fill="#8a6070">Phase ' + (i + 1) + (p.wann ? ' &#183; ' + tspan(p.wann, 24) : '') + '</text>';
    if (i > 0) s += '<line x1="' + x + '" y1="' + TOP + '" x2="' + x + '" y2="' + (TOP + HEADER_H + LANES.length * LANE_H) + '" stroke="#c9ccd4" stroke-dasharray="4,4"/>';
  });
  /* Verbindungen */
  state.connections.forEach(cn => {
    const a = state.postits.find(pp => pp.id === cn.from), b = state.postits.find(pp => pp.id === cn.to);
    if (!a || !b) return;
    const ax = LABEL_W + a.x + PI_W / 2, ay = TOP + HEADER_H + a.y + 24;
    const bx = LABEL_W + b.x + PI_W / 2, by = TOP + HEADER_H + b.y + 24;
    const mx = (ax + bx) / 2;
    s += '<path d="M' + ax + ',' + ay + ' C' + mx + ',' + ay + ' ' + mx + ',' + by + ' ' + bx + ',' + by + '" fill="none" stroke="#1f5fae" stroke-width="1.4" opacity="0.75" marker-end="url(#la)"/>';
  });
  /* Meilensteine */
  state.milestones.forEach(m => {
    const x = LABEL_W + clamp(m.x, 0, canvasW(state));
    const yTop = TOP + HEADER_H;
    s += '<line x1="' + x + '" y1="' + yTop + '" x2="' + x + '" y2="' + (yTop + LANES.length * LANE_H) + '" stroke="#651B32" stroke-width="1.6" stroke-dasharray="6,4"/>';
    const label = tspan(m.label.split(/\s[–-]\sKriterien/)[0], 34);
    const li = LANE_KEYS.indexOf('sache');
    s += '<rect x="' + (x - 4) + '" y="' + (yTop + li * LANE_H - 16) + '" width="' + (label.length * 5.6 + 18) + '" height="16" rx="4" fill="#651B32"/>';
    s += '<text x="' + (x + 4) + '" y="' + (yTop + li * LANE_H - 4) + '" font-size="9" font-weight="bold" fill="#ffffff">&#9670; ' + label + '</text>';
  });
  /* Post-its */
  state.postits.forEach(p => {
    const x = LABEL_W + p.x, y = TOP + HEADER_H + p.y;
    s += '<rect x="' + x + '" y="' + y + '" width="' + PI_W + '" height="46" rx="5" fill="' + (p.color || '#fdf3bf') + '" stroke="#b9b39a" stroke-width="0.8"/>';
    const t = cleanTxt(p.text);
    s += '<text x="' + (x + 6) + '" y="' + (y + 15) + '" font-size="8.5" fill="#26303c">' + tspan(t, 34) + '</text>';
    if (t.length > 34) s += '<text x="' + (x + 6) + '" y="' + (y + 27) + '" font-size="8.5" fill="#26303c">' + esc(t.slice(34, 68)) + (t.length > 68 ? '…' : '') + '</text>';
    const st = p.status || 'offen';
    s += '<circle cx="' + (x + PI_W - 9) + '" cy="' + (y + 9) + '" r="4" fill="' + (st === 'erledigt' ? '#2f8a4c' : st === 'arbeit' ? '#3f6fb0' : '#cfd5dd') + '"/>';
  });
  /* Fusszeile: Ziel + Legende */
  const gy = TOP + HEADER_H + LANES.length * LANE_H + 16;
  s += '<text x="12" y="' + gy + '" font-size="9.5" font-weight="bold" fill="#333333">Gesamtziel:</text>';
  s += '<text x="72" y="' + gy + '" font-size="9.5" fill="#333333">' + tspan(state.goal, 200) + '</text>';
  s += '<text x="12" y="' + (gy + 16) + '" font-size="8.5" fill="#666666">&#9670; Entscheid-Tor &#183; Punkt: grau=offen, blau=in Arbeit, gr&#252;n=erledigt &#183; Pfeile: Ablauf/R&#252;ckkopplung &#183; erzeugt aus der OSTO/SYMA Prozesswand'
    + (ssot() ? ' &#183; Bei Widerspruch gilt: ' + esc(ssot()).slice(0, 80) : '') + '</text>';
  s += '</svg>';
  return s;
}
function downloadLandkarte(fmt) {
  const svg = genLandkarte();
  const name = 'Landkarte - ' + boardName().replace(/[\\/:*?"<>|]/g, '-');
  if (fmt === 'svg') {
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.svg'; a.click(); URL.revokeObjectURL(a.href);
    return;
  }
  const img = new Image();
  img.onload = () => {
    const scale = 2, cv = document.createElement('canvas');
    cv.width = img.width * scale; cv.height = img.height * scale;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
    cv.toBlob(blob => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.png'; a.click(); URL.revokeObjectURL(a.href);
    }, 'image/png');
  };
  img.onerror = () => { sysMsg('PNG-Erzeugung fehlgeschlagen – SVG-Download funktioniert immer.', true); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* Auftrag für Claude Code: gesamter Prozess (oder eine Phase) als MD-Arbeitsauftrag */
function genClaudeAuftrag(sel) {
  const solo = !!state.solo;
  const warns = [];
  const L = [];
  L.push('# Auftrag: ' + boardName());
  L.push('');
  L.push('Quelle: OSTO/SYMA-Prozesswand · Stand ' + heute() + (sel === null ? ' · gesamter Prozess' : ' · nur Phase ' + (sel + 1)));
  if (ssot()) L.push('**Bei Widerspruch gilt: ' + ssot() + '**');
  L.push('');
  L.push('## Gesamtziel');
  L.push(state.goal || '[noch nicht definiert]');
  L.push('');
  L.push('## Arbeitsregeln');
  L.push('- ' + docStyle());
  L.push('- Arbeite Phase für Phase in der angegebenen Reihenfolge; melde nach jeder Phase kurz den Stand.');
  L.push('- Offene fachliche Punkte als [Platzhalter] markieren, nichts erfinden.');
  L.push('- Erstelle die unter «Zu erstellende Dokumente» gelisteten Ergebnisse als eigenständige Dateien.');
  L.push('- Bereits erledigte Schritte (Status erledigt / [x]) nur prüfen, nicht neu machen.');
  L.push('');
  state.phases.forEach((p, i) => {
    if (sel !== null && i !== sel) return;
    L.push('## Phase ' + (i + 1) + ' – ' + p.name);
    if (p.ziel) L.push('- Ziel: ' + p.ziel);
    if (p.input) L.push('- Input: ' + p.input);
    if (p.output) L.push('- Output: ' + p.output);
    if (!solo && p.wer) L.push('- Beteiligte: ' + p.wer);
    if (p.wann) L.push('- Termin: ' + p.wann);
    if (p.wie) L.push('- Vorgehen: ' + p.wie);
    const g = gateOfPhase(i);
    if (g) L.push('- Entscheid-Tor am Phasenende: ' + g.label);
    L.push('');
    const schritte = cardsInPhaseLane(i, 'handlung');
    if (schritte.length) {
      L.push('### Schritte');
      schritte.forEach((c, j) => {
        const stx = exportStatus(c);
        if (stx.warn) warns.push('Phase ' + (i + 1) + ', Schritt «' + cleanTxt(c.text).slice(0, 60) + '»: als erledigt markiert, aber Teilaufgaben offen.');
        L.push((j + 1) + '. ' + cleanTxt(c.text) + '  (Status: ' + stx.label + ')');
        (c.todos || []).forEach(t => L.push('   - [' + (t.done ? 'x' : ' ') + '] ' + t.t + (!solo && t.wer ? ' (zuständig: ' + t.wer + ')' : '')));
        if (c.guide) L.push('   Hinweis: ' + cutAtSentence(stripMd(c.guide).replace(/\n+/g, ' '), 320));
      });
      L.push('');
    }
    const doks = cardsInPhaseLane(i, 'doku');
    if (doks.length) {
      L.push('### Zu erstellende Dokumente');
      doks.forEach(c => L.push('- [' + (c.status === 'erledigt' ? 'x' : ' ') + '] ' + cleanTxt(c.text)));
      L.push('');
    }
    const risk = cardsInPhaseLane(i, 'reflexion');
    if (risk.length) {
      L.push('### Risiken beachten');
      risk.forEach(c => L.push('- ' + cleanTxt(c.text)));
      L.push('');
    }
    if (!solo) {
      const ag = cardsInPhaseLane(i, 'anspruch');
      if (ag.length) {
        L.push('### Einzubeziehen');
        ag.forEach(c => L.push('- ' + cleanTxt(c.text)));
        L.push('');
      }
    }
  });
  if (warns.length) {
    L.push('## Export-Warnungen');
    warns.forEach(w => L.push('- ⚠ ' + w));
    L.push('');
  }
  L.push('---');
  L.push('Erzeugt aus der Prozesswand am ' + heute() + '. Rückfragen an den Projektinhaber statt Annahmen treffen.');
  return L.join('\n');
}

/* ================================================================
   TASK-EXPORT (Pflichtenheft D) – pro Schritt eine MD-Datei mit
   Frontmatter; Verpackung als .zip ohne Fremdbibliothek (Store).

function slug(t) {
  return String(t || '').toLowerCase()
    .replace(/[äöüß]/g, m => ({ 'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss' }[m]))
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'task';
}
/* F2: harte, nicht konfigurierbare Regel – externe Aktionen und Löschungen sind immer «freigabe» */
function taskTyp(c) {
  if (/\b(mail|e-?mail|newsletter|versand|versende|verschick|publizier|veröffentlich|kauf|beschaff|bestell|lösch)/i.test(cleanTxt(c.text || ''))) return 'freigabe';
  return (c.typ === 'freigabe' || c.typ === 'input') ? c.typ : 'auto';
}

/* Kann die KI diesen Schritt allein erledigen? Nein, sobald ein Konto, Geld,

const NUR_MENSCH = /\b(konto|account|zugang|zugriff|anmeld|login|passwort|schlüssel|ssh|token|lizenz|abo|kauf|bestell|zahl|bezahl|rechnung|kreditkarte|budget|vertrag|unterschr|unterzeichn|bewillig|freigab|entscheid|go\/?no.?go|gate|tor\b|besprech|sitzung|termin|treffen|anruf|telefon|interview|rekrutier|akquis|anfrag|kontaktier|einladen|tester|kunde|apple|testflight|dns|domain|hosting|server\s?mieten|installier|gerät|handy|iphone|aufnehm|diktat|fotograf|vor ort|baustelle|begehung|mentor|behörde|amt|datenschutzstelle)/i;

function buildTasks(sel) {
  const tnr = {}, byT = {}, list = [];
  let n = 0;
  state.phases.forEach((p, i) => cardsInPhaseLane(i, 'handlung').forEach(c => {
    n++; const t = 'T-' + String(n).padStart(3, '0');
    tnr[c.id] = t; byT[t] = c; list.push({ c, i, t });
  }));
  const proj = slug(boardName());
  return list.filter(x => sel === null || x.i === sel).map(x => {
    const { c, i, t } = x;
    const deps = state.connections.filter(k => k.to === c.id && tnr[k.from]).map(k => tnr[k.from]);
    const typ = taskTyp(c);
    const owner = (c.owner || '').trim() || (typ === 'input' ? 'doelf' : 'claude_code');
    const st = c.status || 'offen';
    const blocked = st !== 'erledigt' && deps.some(d => (byT[d].status || 'offen') !== 'erledigt');
    const status = st === 'erledigt' ? 'erledigt' : blocked ? 'blockiert' : st === 'arbeit' ? 'in_arbeit' : 'offen';
    const g = gateOfPhase(i);
    const L = ['---',
      'id: ' + t,
      'projekt: ' + proj,
      'phase: ' + (i + 1),
      'ebene: handlung',
      'titel: ' + cleanTxt(c.text).replace(/\s*\n\s*/g, ' ').trim(),
      'status: ' + status,
      'typ: ' + typ,
      'owner: ' + owner];
    if (deps.length) L.push('abhaengig_von: [' + deps.join(', ') + ']');
    if (ssot()) L.push('ssot: ' + ssot());
    L.push('---', '', '## Auftrag');
    L.push(cleanTxt(c.text).trim() + ' — Projekt «' + boardName() + '», Phase ' + (i + 1) + (state.phases[i].name ? ' (' + state.phases[i].name + ')' : '') + '.');
    if (c.auftrag) L.push(cleanTxt(c.auftrag).replace(/\s*\n\s*/g, ' ').trim());
    if (c.guide) L.push(cutAtSentence(stripMd(c.guide).replace(/\n+/g, ' '), 400));
    if (typ === 'freigabe') L.push('Wirkung erst nach Freigabe durch den Projektinhaber: vollständig vorbereiten, nicht ausführen.');
    if (g) L.push('Entscheid-Tor am Phasenende: ' + g.label.split(/\s[–-]\sKriterien/)[0] + ' (Go/No-Go, Freigabe nötig).');
    L.push('Privacy-Regel: Ins Repo und in die status.json gehören nur Code, Dokumente, Task-Titel und Status – nie Screenshots, OCR- oder Inhaltsauszüge.');
    L.push('Nachweis-Regel: «erledigt» gilt nur mit Beleg – Ergebnis als Datei im Repo ablegen und unter «ergebnis_datei» eintragen; Behauptungen ohne Datei zählen nicht.');
    L.push('Stopp-Regel: Nach 2 gescheiterten Versuchen status auf blockiert setzen und in notizen festhalten, woran es scheitert – nicht endlos weiterprobieren.');
    L.push('', '## Akzeptanzkriterien');
    const tds = (c.todos || []).filter(td => td && td.t);
    if (tds.length) tds.forEach(td => L.push('- [' + (td.done ? 'x' : ' ') + '] ' + td.t));
    else L.push('- [ ] Ergebnis liegt als Datei vor und erfüllt den Auftrag');
    L.push('', '## Ergebnis (füllt das ausführende LLM)', 'status:', 'ergebnis_datei:', 'notizen:', '');
    return { name: t + '-' + slug(cleanTxt(c.text)) + '.md', data: L.join('\n') };
  });
}

/* Minimaler ZIP-Schreiber (nur Store, UTF-8-Namen) – keine externe Bibliothek nötig */
/* ================================================================
   GITHUB-ANSCHLUSS (V39) – Tasks direkt ins Repo schreiben und den
   Status auch aus privaten Repos lesen. Pflichtenheft D3 (geändert
   Juli 2026): Schreiben nur ins EINE konfigurierte Repo; der Schlüssel
   (Fine-grained Token, nur dieses Repo) bleibt lokal im Browser.
   ================================================================ */
const GH_TOKEN_STORE = 'pw-github-token';
function ghToken() { return (localStorage.getItem(GH_TOKEN_STORE) || '').trim(); }
function ghRepoCfg() { return (state.ghRepo || '').trim().replace(/^https:\/\/github\.com\//, '').replace(/\/+$/, ''); }
function ghHeaders() {
  return {
    'authorization': 'Bearer ' + ghToken(),
    'accept': 'application/vnd.github+json',
    'x-github-api-version': '2022-11-28'
  };
}
function b64utf8(s) { return btoa(unescape(encodeURIComponent(s))); }
async function ghPut(repo, path, content, msg) {
  const url = 'https://api.github.com/repos/' + repo + '/contents/' + path.split('/').map(encodeURIComponent).join('/');
  let sha;
  const g = await fetch(url, { headers: ghHeaders(), cache: 'no-store' });
  if (g.ok) { const j = await g.json().catch(() => null); if (j && j.sha) sha = j.sha; }
  const body = { message: msg, content: b64utf8(content) };
  if (sha) body.sha = sha;
  const r = await fetch(url, { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
  if (!r.ok) {
    const d = await r.json().catch(() => null);
    throw new Error((d && d.message) || ('GitHub HTTP ' + r.status));
  }
}
/* Initiale status.json aus der Wand (die laufende Pflege übernimmt build_status.py im Repo) */
function buildStatusJson() {
  const phasen = state.phases.map((p, i) => {
    const t = tasksOfPhase(i);
    const erled = t.filter(c => (c.status || 'offen') === 'erledigt').length;
    return { nr: i + 1, erledigt: erled, offen: t.length - erled, blockiert: 0 };
  });
  const ms = {};
  state.milestones.forEach(m => { ms[cleanTxt(m.label).split(/\s[–-]\s/)[0].slice(0, 60)] = 'offen'; });
  const gate = nextGate();
  const warten = state.postits
    .filter(c => laneKeyOfY(c.y) === 'handlung' && taskTyp(c) !== 'auto' && (c.status || 'offen') !== 'erledigt')
    .slice(0, 3).map(c => cleanTxt(c.text).replace(/\s*\n\s*/g, ' ').slice(0, 80));
  return JSON.stringify({
    projekt: slug(boardName()),
    stand: new Date().toISOString(),
    meilensteine: ms,
    phasen,
    naechster_entscheid: gate ? gate.label : '',
    wartet_auf_input: warten
  }, null, 2);
}
async function runGhTaskUpload(sel) {
  const repo = ghRepoCfg();
  const files = buildTasks(sel);
  if (!files.length) { sysMsg('Keine Schritte auf der Handlungsebene – nichts zu übertragen.', true); return; }
  /* V46-Schutz: Das Repo ist führend. Nur NEUE Karten hochladen – bestehende Task-Dateien
     (und deren Ergebnisse) sowie die status.json werden nie überschrieben. Neue Aufgaben
     bekommen Nummern NACH der höchsten im Repo, Abhängigkeiten werden umnummeriert. */
  const wait = sysMsg('🔎 prüft zuerst, was im Repo schon vorhanden ist …', true);
  let existing = [];
  let ordnerDa = false;
  try {
    const r = await fetch('https://api.github.com/repos/' + repo + '/contents/tasks', { headers: ghHeaders(), cache: 'no-store' });
    if (r.ok) { ordnerDa = true; existing = (await r.json()).map(x => x.name).filter(n => /\.md$/.test(n)); }
    else if (r.status !== 404) throw new Error('GitHub HTTP ' + r.status);
  } catch (e) {
    wait.remove();
    sysMsg('❌ GitHub: ' + e.message + ' – Repo-Name und Schlüssel unter «⚙ GitHub» prüfen.');
    return;
  }
  const slugVon = n => n.replace(/^T-\d+-/, '').replace(/\.md$/, '');
  const slugsDa = new Map(existing.map(n => [slugVon(n), (n.match(/^T-\d+/) || [''])[0]]));
  let maxId = 0;
  existing.forEach(n => { const m = n.match(/^T-(\d+)-/); if (m) maxId = Math.max(maxId, +m[1]); });
  /* Endgültige Nummern bestimmen (bestehende behalten ihre, neue zählen oben weiter) */
  const idMap = {}, neu = [];
  let skip = 0;
  files.forEach(f => {
    const oldId = (f.name.match(/^T-\d+/) || ['T-000'])[0], s = slugVon(f.name);
    if (slugsDa.has(s)) { idMap[oldId] = slugsDa.get(s) || oldId; skip++; return; }
    maxId++;
    const nid = 'T-' + String(maxId).padStart(3, '0');
    idMap[oldId] = nid;
    neu.push({ f, oldId, nid });
  });
  const all = neu.map(x => {
    let data = x.f.data.replace(/^id: T-\d+$/m, 'id: ' + x.nid);
    data = data.replace(/^abhaengig_von: \[(.*)\]$/m, (mm, ids) =>
      'abhaengig_von: [' + ids.split(',').map(y => idMap[y.trim()] || y.trim()).join(', ') + ']');
    return { path: 'tasks/' + x.nid + x.f.name.slice(x.oldId.length), data };
  });
  if (!ordnerDa || !existing.length) {
    // Erst-Einrichtung eines leeren Repos: Skript, Anleitung und Start-status.json mitgeben
    all.push({ path: 'build_status.py', data: TASKS_SCRIPT });
    all.push({ path: 'README-tasks.md', data: TASKS_README });
    all.push({ path: 'status.json', data: buildStatusJson() });
  }
  wait.remove();
  if (!all.length) {
    sysMsg('✅ Nichts zu übertragen: Alle ' + skip + ' Karte(n) sind schon als Aufgaben im Repo (das Repo bleibt führend und wird nie überschrieben).', true);
    return;
  }
  const wait2 = sysMsg('⬆️ überträgt ' + all.length + ' Datei(en) nach GitHub (' + repo + ') …', true);
  try {
    for (const f of all) await ghPut(repo, f.path, f.data, 'Prozesswand: ' + f.path + ' anlegen');
    wait2.remove();
    state.statusUrl = 'github:' + repo + ':status.json';
    save();
    sysMsg('✅ ' + all.length + ' Datei(en) neu auf GitHub (' + repo + ')' + (skip ? ' – ' + skip + ' bereits vorhandene übersprungen (nie überschrieben)' : '') + '. Das Dashboard liest den Stand automatisch von dort.');
    fetchGhStatus();
  } catch (e) {
    wait2.remove();
    sysMsg('❌ GitHub: ' + e.message + ' – Repo-Name und Schlüssel unter «⚙ GitHub» prüfen.');
  }
}

function makeZip(files) {
  const enc = new TextEncoder();
  const T = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c >>> 0; } return t; })();
  const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = T[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], cdir = []; let off = 0, cdSize = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true);           /* Signatur */
    h.setUint16(4, 20, true);                    /* Version */
    h.setUint16(6, 0x0800, true);                /* Flags: UTF-8-Namen */
    h.setUint16(8, 0, true);                     /* Methode: Store */
    h.setUint16(10, 0, true);                    /* Zeit */
    h.setUint16(12, 0x5CF2, true);               /* Datum (fix) */
    h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true);
    h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true);
    h.setUint16(28, 0, true);
    parts.push(h.buffer, name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true);
    cd.setUint16(14, 0x5CF2, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, off, true);
    cdir.push(cd.buffer, name);
    cdSize += 46 + name.length;
    off += 30 + name.length + data.length;
  });
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob(parts.concat(cdir, [e.buffer]), { type: 'application/zip' });
}

  addMsg('user', '[Karten-Check] ' + cards.length + ' Post-it(s) prüfen');

    const out = await callClaude(

      + 'Sei wohlwollend: bestätige, was in Ordnung ist. '
      + 'Schreibe hinweis und empfehlung in einfachem Alltagsdeutsch für einen nicht-technischen Nutzer (Schweizer Schreibweise, ss statt ß): je EIN kurzer Satz, keine Fachbegriffe – statt «Dublette» sag «gibt es schon als Karte …», statt «Artefakt» sag «Dokument». Die Empfehlung nennt konkret, was er tun soll (z. B. «Karte löschen, sie gibt es schon auf der Ebene Sache»). '
      + 'Antworte NUR als JSON: {"karten":[{"k":"K1","ok":true},{"k":"K2","ok":false,"hinweis":"kurz was stört","empfehlung":"kurz was tun"}]}',
      'Gesamtziel: ' + (state.goal || '-') + '\nZu prüfen:\n' + liste + '\n\nBestehende Wand (Kontext):\n' + wallContext(),

};

/* ================================================================
   FRAGEKATALOG – autonome Pain-Point-Analyse (McKinsey) in der Wand
   Quelle der Regeln: skills/fragekatalog/SKILL.md
   ================================================================ */
let fkRound = null, fkAwait = false;
const FK_SYS = 'Du bist der Fragekatalog der OSTO/SYMA-Prozesswand: autonome Pain-Point-Erkennung nach McKinsey-Framework (hypothesengetrieben, MECE, 80/20, SCQA) mit minimalem Kundenkontakt. '
  + 'Ebenen-Schlüssel: reflexion (Risiken/Erfolgsmessung), input (Vorleistungen/Daten/Budget), mgmt1 (Führung/Entscheid), mgmt2 (Steuerung/Takt/Reviews), sache (Inhalt/Zwischenziele/Abgrenzung), handlung (Tätigkeiten/Kapazität), doku (Ablage/Ergebnisse), anspruch (Betroffene/Blockierer). '
  + 'Regeln: 1) Alles zuerst selbständig aus Ziel und Wand ableiten, nichts auf Vorrat fragen. 2) Pro Ebene 1–3 Hypothesen, jede genau einer Ebene zugeordnet (MECE). 3) Jede Hypothese bewerten: impact und konfidenz je hoch/mittel/niedrig, beleg als Halbsatz (Beleg oder Annahme). '
  + '4) Eine Frage nur, wo impact hoch UND konfidenz höchstens mittel ist; maximal 3 Fragen, pro Pain Point eine; geschlossen formuliert, sodass ein Satz oder eine Zahl als Antwort genügt. Null Fragen ist der Normalfall. 5) Jede nicht gestellte Frage als Annahme dokumentieren. '
  + 'Ist die Wand fast leer, gilt Modus IST-Aufnahme: je Ebene 1–2 IST-Annahmen zur Korrektur statt Pain Points; Regeln bleiben gleich. '
  + 'Antworte NUR als JSON: {"modus":"pain"|"ist","scqa":{"kern":"…","situation":"…","komplikation":"…","kernfrage":"…"},"landkarte":[{"ebene":"reflexion","phase":1,"pain":"…","impact":"hoch","konfidenz":"mittel","beleg":"…"}],"fragen":[{"frage":"…","warum":"…"}],"annahmen":["…"]} '
  + '"phase" ist die Nummer der am besten passenden Phase. Deutsch, Schweizer Schreibweise (ss statt ß).';

function fkLaneName(key) { const l = LANES.find(x => x.key === key); return l ? laneTitle(l) : key; }

function fkRender(res) {
  fkRound = res;
  const rank = { hoch: 0, mittel: 1, niedrig: 2 };
  const karte = (res.landkarte || []).slice().sort((a, b) => (rank[a.impact] ?? 3) - (rank[b.impact] ?? 3));
  const fragen = (res.fragen || []).slice(0, 3);
  let t = '🧭 Kernaussage: ' + ((res.scqa && res.scqa.kern) || '–');
  if (res.scqa) t += '\nSituation: ' + (res.scqa.situation || '–') + ' · Komplikation: ' + (res.scqa.komplikation || '–') + ' · Kernfrage: ' + (res.scqa.kernfrage || '–');
  t += '\n\n🗺️ ' + (res.modus === 'ist' ? 'IST-Landkarte' : 'Pain-Point-Landkarte') + ':';
  karte.forEach(e => { t += '\n– ' + fkLaneName(e.ebene) + ' · ' + e.pain + ' (Impact ' + (e.impact || '?') + ' · Konfidenz ' + (e.konfidenz || '?') + ')' + (e.beleg ? ' – ' + e.beleg : ''); });
  t += '\n\n❓ Fragen an dich:';
  if (fragen.length) fragen.forEach((f, i) => { t += '\n' + (i + 1) + '. ' + f.frage + (f.warum ? ' – Warum: ' + f.warum : ''); });
  else t += '\nKeine Rückfragen nötig – alle Annahmen sind dokumentiert.';
  if ((res.annahmen || []).length) { t += '\n\n📌 Dokumentierte Annahmen:'; res.annahmen.forEach(a => { t += '\n– ' + a; }); }
  t += '\n\n➡️ Nächster Schritt: Punkte unten als Karten übernehmen' + (res.modus === 'ist' ? ', dann «🤖 KI-Struktur» starten.' : ' und im Dashboard weiterverfolgen.');
  addMsg('ai', t);
  if (karte.length || fragen.length) fkActionBar(res, karte);
  if (fragen.length) { fkAwait = true; sysMsg('Antworte einfach unten im Chat – ich arbeite deine Antworten ein. («stopp» beendet den Fragekatalog) Oder mach aus den Fragen mit dem Knopf oben eine Umfrage an andere.', true); }
  else fkAwait = false;
}

function fkActionBar(res, karte) {
  const bar = document.createElement('div');
  bar.className = 'msg sys';
  if (karte.length) {
    const b = document.createElement('button');
    b.textContent = (res.modus === 'ist' ? '✚ ' : '⚠️ ') + karte.length + ' Punkte als Karten auf die Wand';
    b.onclick = () => {
      let n = 0;
      karte.forEach(e => {
        if (LANE_KEYS.indexOf(e.ebene) < 0 || !e.pain) return;
        const pi = clamp((parseInt(e.phase, 10) || 1) - 1, 0, state.phases.length - 1);
        addCard(pi, e.ebene, (res.modus === 'ist' ? '' : '⚠️ ') + e.pain, 'offen');
        n++;
      });
      save(); render(); b.remove();
      sysMsg('✅ ' + n + ' Karten ergänzt (über Rückgängig widerrufbar). Tipp: danach ✓ Karten-Check laufen lassen.');
    };
    bar.appendChild(b);
  }
  /* T-017: offene Fragen mit einem Klick als Umfrage (Link/QR/Mail-Entwürfe, Rücklauf im Dashboard) */
  const fragen = (res.fragen || []).slice(0, 3);
  if (fragen.length) {
    const b2 = document.createElement('button');
    b2.textContent = '📋 ' + fragen.length + ' Frage(n) als Umfrage an andere';
    b2.onclick = () => {
      const bef = neueBefragung({
        titel: 'Rückfragen ' + boardName(),
        intro: (res.scqa && res.scqa.kernfrage) ? 'Es geht um: ' + res.scqa.kernfrage + ' Ihre Antworten helfen uns weiter – dauert nur wenige Minuten.' : 'Ihre Antworten helfen uns weiter – dauert nur wenige Minuten.',
        fragen: fragen.map(f => ({ f: f.frage, typ: 'text' })),
        quelle: 'fragekatalog', fkRound: res
      });
      b2.remove();
      navigator.clipboard && navigator.clipboard.writeText(bef.link);
      sysMsg('📋 Umfrage erstellt und Link kopiert:\n' + bef.link + '\n\nIm Dashboard unter «Befragungen» kannst du sie Anspruchsgruppen zuordnen, Mail-Entwürfe erzeugen und den Rücklauf verfolgen. Eingegangene Antworten arbeitest du dort mit «↩ In Fragekatalog» wieder ein.', true);
    };
    bar.appendChild(b2);
  }
  kiLog.appendChild(bar); kiLog.scrollTop = kiLog.scrollHeight;
}

async function runFragekatalog(scopeLabel, scopeHint) {
  if (previewState) return;
  if (!kiBereit()) { openKeyModal(() => runFragekatalog(scopeLabel, scopeHint)); return; }
  addMsg('user', '[Fragekatalog] ' + scopeLabel);
  const wait = sysMsg('🗺️ analysiert selbständig – Ebenen, Belege, offene Punkte …', true);
  try {
    const user = 'Scope: ' + scopeLabel + (scopeHint ? '\n' + scopeHint : '') + '\n\nAktuelle Wand:\n' + wallContext();
    const out = await callClaude(FK_SYS, user, CHAT_MODEL, 6000, SWARM_TEMP);
    let res;
    try { res = extractJSON(out); }
    catch (pe) { // Antwort war unvollständig (volle Wand) → einmal kompakter anfordern
      const out2 = await callClaude(FK_SYS, user + '\n\nWICHTIG: Antworte kompakt – höchstens 2 Punkte pro Ebene, beleg in maximal 8 Wörtern – und NUR mit vollständigem, gültigem JSON.', CHAT_MODEL, 6000, SWARM_TEMP);
      res = extractJSON(out2);
    }
    wait.remove();
    fkRender(res);
  } catch (e) { wait.remove(); fkAwait = false; addMsg('sys', '❌ Fragekatalog: ' + e.message); }
}

async function fkFollowup(antwort) {

      + '\n\nAktuelle Wand:\n' + wallContext();

      const out2 = await callClaude(FK_SYS, user + '\n\nWICHTIG: Antworte kompakt – höchstens 2 Punkte pro Ebene, beleg in maximal 8 Wörtern – und NUR mit vollständigem, gültigem JSON.', CHAT_MODEL, 6000, SWARM_TEMP);
      res = extractJSON(out2);
    }
    wait.remove();
    fkRender(res);
  } catch (e) { wait.remove(); fkAwait = false; addMsg('sys', '❌ Fragekatalog: ' + e.message); }
}

/* ================================================================

   ================================================================ */
const GUIDE_ORDER = ['sache', 'handlung', 'input', 'mgmt2', 'mgmt1', 'doku', 'anspruch', 'reflexion'];
let guide = null;
function stripMd(t) { return String(t || '').replace(/\*\*/g, '').replace(/^#+\s*/gm, ''); }
/* Erwartetes Arbeitsergebnis je Ebene – macht jeden Umsetzungs-Prompt schrittspezifisch */
const LANE_ERGEBNIS = {
  handlung: 'das konkrete Arbeitsergebnis dieser Tätigkeit (z.B. Checkliste, Plan, E-Mail, Analyse)',
  doku: 'das fertige Dokument selbst',
  sache: 'einen messbaren Zwischenstand mit klaren Prüfkriterien (erfüllt ja/nein)',
  reflexion: 'eine kurze Risikobewertung mit konkreten Gegenmassnahmen',
  anspruch: 'einen Einbezugs- und Kommunikationsplan für diese Anspruchsgruppe',
  input: 'eine Abklärung mit den genannten Fachpersonen inkl. konkretem Fragenkatalog',
  mgmt1: 'eine Entscheidungsvorlage für die Bereichsleitung (Optionen, Empfehlung)',
  mgmt2: 'eine Steuerungsunterlage für die Projektleitung'
};
function buildStepPrompt(c, pi, lane) {
  const p = state.phases[pi] || {};
  return 'Kontext: Projekt «' + boardName() + '».\nGesamtziel: ' + (state.goal || '-')
    + '\nPhase ' + (pi + 1) + ': ' + (p.name || '-') + (p.ziel ? ' – Phasenziel: ' + p.ziel : '')
    + '\nEbene: ' + laneTitle(lane)
    + '\nSchritt (Post-it): "' + cleanTxt(c.text) + '"'
    + ((c.todos || []).length ? '\nTeilaufgaben zu diesem Schritt:\n' + c.todos.map(t => '– ' + t.t + (!state.solo && t.wer ? ' (zuständig: ' + t.wer + ')' : '')).join('\n') : '')
    + (c.guide ? '\nHinweise des Prozessbegleiters:\n' + stripMd(c.guide) : '')
    + '\n\nAuftrag: Setze GENAU diesen Schritt um – «' + cleanTxt(c.text).slice(0, 120) + '». Erwartetes Ergebnis: '
    + (LANE_ERGEBNIS[laneKeyOfY(c.y)] || 'das passende Arbeitsergebnis') + '.'
    + ((c.todos || []).length ? ' Arbeite die Teilaufgaben sichtbar ab (je ein Abschnitt oder Punkt).' : '')
    + '\nStil-Vorgabe: ' + docStyle();
}
function markGuideCard() {
  canvas.querySelectorAll('.postit.guide-now').forEach(e => e.classList.remove('guide-now'));

function gateOfPhase(i) {
  const l = phaseLeft(i), r = l + state.phases[i].w;
  return state.milestones.find(m => m.x > l + state.phases[i].w * 0.4 && m.x <= r + 40);

/* ---- Pflichtenheft F5/D2: Steuerung & status.json aus GitHub (nur lesen) ---- */
let ghStatus = null, ghStatusErr = '';
async function fetchGhStatus() {
  const url = (state.statusUrl || '').trim();
  if (!url) { ghStatus = null; ghStatusErr = ''; return; }
  try {
    let r;
    if (url.startsWith('github:')) {
      // privates Repo: über die GitHub-API lesen (mit dem lokal gespeicherten Schlüssel)
      const rest = url.slice(7), ci = rest.lastIndexOf(':');
      const repo = rest.slice(0, ci), path = rest.slice(ci + 1);
      r = await fetch('https://api.github.com/repos/' + repo + '/contents/' + path + '?ts=' + Date.now(), {
        cache: 'no-store',
        headers: { 'authorization': 'Bearer ' + ghToken(), 'accept': 'application/vnd.github.raw+json', 'x-github-api-version': '2022-11-28' }
      });
    } else {
      r = await fetch(url + (url.includes('?') ? '&' : '?') + 'ts=' + Date.now(), { cache: 'no-store' });
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    ghStatus = await r.json(); ghStatusErr = '';
    syncErledigtVonStatus();
  } catch (e) { ghStatus = null; ghStatusErr = e.message; }
  if (document.getElementById('dash').style.display === 'block') renderDash();
}
/* V46: Erledigtes aus der status.json automatisch auf die Wand übernehmen –
   das Abhaken von Hand entfällt. Zuordnung über den Aufgaben-Titel (= Kartentext). */
function syncErledigtVonStatus() {
  if (!ghStatus || !Array.isArray(ghStatus.tasks)) return 0;
  const norm = t => String(t || '').toLowerCase().replace(/[^a-z0-9äöüéèàç]+/g, '').slice(0, 60);
  let n = 0;
  ghStatus.tasks.forEach(t => {
    if (t.status !== 'erledigt' || !t.titel) return;
    const nt = norm(t.titel);
    if (!nt) return;
    state.postits.forEach(c => {
      if ((c.status || 'offen') === 'erledigt' || laneKeyOfY(c.y) !== 'handlung') return;
      if (norm(cleanTxt(c.text)) === nt) { c.status = 'erledigt'; stempelErledigt(c); n++; }
    });
  });
  if (n) {
    save(); render();
    sysMsg('✓ ' + n + ' Karte(n) automatisch als erledigt abgehakt (Stand aus GitHub) – über Rückgängig widerrufbar.', true);
  }
  return n;
}
function nextGate() {
  let from = state.phases.length;
  for (let i = 0; i < state.phases.length; i++) {
    const t = tasksOfPhase(i);
    if (!t.length || t.some(c => c.status !== 'erledigt')) { from = i; break; }
  }
  for (let i = from; i < state.phases.length; i++) {
    const g = gateOfPhase(i);
    if (g) return { label: g.label.split(/\s[–-]\sKriterien/)[0], phase: i, due: g.due || '' };
  }
  return null;
}
/* Entscheid aus dem Dashboard (T-015): schreibt Freigabe/Ablehnung in die Task-Datei und führt status.json nach */
async function ghEntscheid(tid, ok) {
  const repo = ghRepoCfg();
  if (!repo || !ghToken()) { sysMsg('Zuerst unter «Dokumente → ⚙ GitHub» Repo und Schlüssel hinterlegen.', true); return; }
  let bem = '';
  if (!ok) { bem = (prompt('Was soll anders sein? (Bemerkung zur Ablehnung)') || '').trim(); if (!bem) return; }
  else if (!confirm('«' + tid + '» jetzt freigeben? Der Entscheid wird im Repo dokumentiert.')) return;
  try {
    const listR = await fetch('https://api.github.com/repos/' + repo + '/contents/tasks', { headers: ghHeaders(), cache: 'no-store' });
    if (!listR.ok) throw new Error('tasks-Ordner im Repo nicht gefunden');
    const f = (await listR.json()).find(x => x.name && x.name.startsWith(tid + '-'));
    if (!f) throw new Error('Aufgabe ' + tid + ' nicht im Repo gefunden');
    const fj = await (await fetch('https://api.github.com/repos/' + repo + '/contents/tasks/' + encodeURIComponent(f.name), { headers: ghHeaders(), cache: 'no-store' })).json();
    let inhalt = decodeURIComponent(escape(atob(String(fj.content || '').replace(/\n/g, ''))));
    const stempel = (ok ? 'Freigegeben' : 'Abgelehnt') + ' durch Dölf am ' + heute() + ' (Dashboard)' + (bem ? ' – Bemerkung: ' + bem : '');
    if (ok) inhalt = inhalt.replace(/^status: .*$/m, 'status: erledigt');
    inhalt = inhalt.replace(/^notizen:.*$/m, z => z.trim() === 'notizen:' ? 'notizen: ' + stempel : z + ' | ' + stempel);
    await ghPut(repo, 'tasks/' + f.name, inhalt, 'Dashboard-Entscheid: ' + tid + ' ' + (ok ? 'freigegeben' : 'abgelehnt'));
    if (ok) {
      // status.json nachführen: Aufgabe aus «wartet» nehmen, Phasenzähler anpassen
      try {
        const sj = await (await fetch('https://api.github.com/repos/' + repo + '/contents/status.json', { headers: ghHeaders(), cache: 'no-store' })).json();
        const st = JSON.parse(decodeURIComponent(escape(atob(String(sj.content || '').replace(/\n/g, '')))));
        if (Array.isArray(st.wartet_auf_input)) st.wartet_auf_input = st.wartet_auf_input.filter(t => !String(t).startsWith(tid + ' '));
        const pm = inhalt.match(/^phase: (\d+)$/m);
        if (pm && Array.isArray(st.phasen)) { const ph = st.phasen.find(p => p.nr === +pm[1]); if (ph) { ph.erledigt++; ph.offen = Math.max(0, ph.offen - 1); } }
        st.stand = new Date().toISOString();
        await ghPut(repo, 'status.json', JSON.stringify(st, null, 2), 'Dashboard-Entscheid: status.json nachführen');
      } catch (e2) { /* status.json wird spätestens beim nächsten Arbeitslauf neu gerechnet */ }
    }
    sysMsg((ok ? '✅ ' + tid + ' freigegeben' : '📝 ' + tid + ' abgelehnt mit Bemerkung') + ' – im Repo dokumentiert.');
    fetchGhStatus();
  } catch (e) { sysMsg('❌ Entscheid: ' + e.message, true); }
}
function wartetAufDich() {
  const out = [];
  state.postits.forEach(c => {
    if ((c.status || 'offen') === 'erledigt') return;
    const typ = taskTyp(c);
    if (typ === 'freigabe') out.push({ c, art: 'Freigabe' });

  (ghStatus && Array.isArray(ghStatus.wartet_auf_input) ? ghStatus.wartet_auf_input : []).forEach(t => out.push({ txt: String(t), art: 'Input (Repo)' }));
  return out;
}

      : '<div style="font-size:12px;color:var(--muted)">Keine Anspruchsgruppen-Karten auf der Wand.</div>')
    + '<div class="btnrow"><button class="go" id="bgSave">Speichern</button><button id="mCancel">Abbrechen</button></div>');
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('bgSave').onclick = () => {
    bef.gruppen = [...modalBox.querySelectorAll('.bg-cb:checked')].map(cb => cb.value);
    save(); closeModal(); renderDash();
  };
}

function renderDash() {
  const body = document.getElementById('dashBody');
  const all = [];
  state.phases.forEach((p, i) => tasksOfPhase(i).forEach(c => all.push({ c, i })));
  const nOffen = all.filter(t => (t.c.status||'offen') === 'offen').length;
  const nArbeit = all.filter(t => t.c.status === 'arbeit').length;
  const nDone = all.filter(t => t.c.status === 'erledigt').length;
  const pct = all.length ? Math.round(nDone / all.length * 100) : 0;
  let nRisk = 0; state.phases.forEach((p, i) => { nRisk += cardsInPhaseLane(i, 'reflexion').length; });
  const ng = nextGate();
  const wd = wartetAufDich();
  /* V53: Tagesbilanz – heute Erledigtes zählt der Stempel erledigtAm */
  const heuteIso = new Date().toISOString().slice(0, 10);
  const nHeute = state.postits.filter(c => c.erledigtAm === heuteIso).length;

  let h = '<div class="tiles">'
    + '<div class="tile"><div class="tl">Projektfortschritt</div><div class="tv">' + pct + '%</div><div class="ts">' + nDone + ' von ' + all.length + ' Aufgaben erledigt</div></div>'
    + '<div class="tile"><div class="tl">Heute erledigt</div><div class="tv">' + nHeute + '</div><div class="ts">Karten seit Mitternacht</div></div>'
    + '<div class="tile"><div class="tl">Wartet auf dich</div><div class="tv">' + wd.length + '</div><div class="ts">Freigaben und Eingaben</div></div>'
    + '<div class="tile"><div class="tl">Offen</div><div class="tv">' + nOffen + '</div><div class="ts">Aufgaben</div></div>'
    + '<div class="tile"><div class="tl">In Arbeit</div><div class="tv">' + nArbeit + '</div><div class="ts">Aufgaben</div></div>'
    + '<div class="tile"><div class="tl">Risiken / Reflexion</div><div class="tv">' + nRisk + '</div><div class="ts">Karten auf der Reflexionsebene</div></div>'
    + '<div class="tile"><div class="tl">Gesamtziel</div><div class="ts" style="margin-top:4px">' + esc((state.goal||'– noch nicht definiert –').slice(0,160)) + '</div></div>'
    + '</div>';

  /* F5: Steuerung – nächstes Tor, «wartet auf dich» (max. 3), Rest in Warteschlange */
  h += '<div class="dash-sec"><h3>Steuerung <span style="font-weight:400;color:var(--muted);font-size:11px">autonom bis zum n&auml;chsten Tor</span></h3>'
    + '<div style="font-size:13px;margin:4px 0"><b>N&auml;chstes Entscheid-Tor:</b> '
    + (ghStatus && ghStatus.naechster_entscheid ? esc(String(ghStatus.naechster_entscheid))
      : ng ? '&#9670; ' + esc(ng.label.slice(0, 90)) + ' (Ende Phase ' + (ng.phase + 1) + ')'
        + (ng.due ? ' &middot; bis ' + fmtDue(ng.due) + (isOverdue(ng.due) ? ' <span style="color:#a33;font-weight:700">&#9888; &uuml;berf&auml;llig</span>' : '') : '')
      : '&ndash; keines definiert &ndash;') + '</div>';
  if (wd.length) {
    h += '<div style="font-size:13px;margin:6px 0 2px"><b>Wartet auf dich</b> (' + wd.length + '):</div><ul style="margin:2px 0 4px 18px;padding:0">';
    wd.slice(0, 3).forEach(x => {
      /* Freigabe-Knopf (T-015): Repo-Aufgaben direkt aus dem Dashboard entscheiden */
      const m = !x.c && ghRepoCfg() && ghToken() ? String(x.txt).match(/^(T-\d+)\s/) : null;
      const knoepfe = m ? ' <button data-ghok="' + m[1] + '" style="font-size:11px;padding:2px 8px;margin-left:6px">&#10003; Freigeben</button><button data-ghno="' + m[1] + '" style="font-size:11px;padding:2px 8px">&#10007; Ablehnen</button>' : '';
      h += '<li style="font-size:12.5px;margin:2px 0"><span style="background:#f7e8c5;border-radius:8px;padding:0 7px;font-size:11px;font-weight:700">' + x.art + '</span> '
        + esc(x.c ? cleanTxt(x.c.text).slice(0, 90) : x.txt.slice(0, 90)) + knoepfe
        + ' <button data-kritik="' + wd.indexOf(x) + '" title="Vor dem Entscheid 2&ndash;3 S&auml;tze Einwand von der KI holen (ein kleiner KI-Aufruf, nur auf Klick)" style="font-size:11px;padding:2px 8px">&#128269; Kritiker fragen</button></li>';
    });
    h += '</ul>';
    if (wd.length > 3) h += '<div style="font-size:11px;color:var(--muted)">+ ' + (wd.length - 3) + ' weitere in der Warteschlange (bewusst max. 3 aufs Mal)</div>';
  } else {
    h += '<div style="font-size:12px;color:var(--muted)">Nichts wartet auf dich &ndash; alles l&auml;uft oder ist erledigt.</div>';
  }
  h += '</div>';

  /* D2: status.json aus GitHub – Raw-URL, Polling beim Öffnen + Refresh-Knopf */
  h += '<div class="dash-sec"><h3>Projekt-Status aus GitHub (status.json) <span style="font-weight:400;color:var(--muted);font-size:11px">die Wand liest nur &ndash; sie schreibt nichts</span></h3>'
    + '<div style="display:flex;gap:6px;margin:4px 0"><input type="text" id="ghUrl" value="' + esc(state.statusUrl || '') + '" placeholder="https://raw.githubusercontent.com/&hellip;/status.json" style="flex:1;font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:6px">'
    + '<button id="ghRefresh" style="font:inherit;font-size:12px;font-weight:700;cursor:pointer;border:0;border-radius:6px;background:var(--accent);color:#fff;padding:6px 12px">&#8635; Aktualisieren</button>'
    + '<button id="ghPortfolio" title="&Uuml;bersicht &uuml;ber alle Projekte (liest mehrere status.json)" style="font:inherit;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--accent);color:var(--accent);border-radius:6px;background:#eef4fb;padding:6px 12px">Portfolio</button></div>';
  if (ghStatusErr && (state.statusUrl || '').trim()) {
    h += '<div style="font-size:12px;color:#a33">Konnte status.json nicht laden: ' + esc(ghStatusErr) + '</div>';
  }
  if (ghStatus) {
    /* V52: «lebt der Kreislauf?» – Stand menschenlesbar plus Frische-Warnung */
    let standTxt = '–', standAlt = false;
    if (ghStatus.stand) {
      const d = new Date(ghStatus.stand);
      if (!isNaN(d)) {
        const stdn = (Date.now() - d.getTime()) / 3600000;
        const uhr = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        standTxt = stdn < 24 && d.getDate() === new Date().getDate() ? 'heute ' + uhr
          : stdn < 48 ? 'gestern ' + uhr : 'vor ' + Math.round(stdn / 24) + ' Tag(en)';
        standAlt = stdn > 26;
      } else standTxt = esc(String(ghStatus.stand));
    }
    h += '<div style="font-size:12px;color:var(--muted)">Projekt: ' + esc(String(ghStatus.projekt || '–')) + ' &middot; Claude-Routine zuletzt aktiv: <b>' + standTxt + '</b></div>';
    if (standAlt) h += '<div style="font-size:12px;color:#a33;font-weight:700">&#9888; Die Routine hat seit &uuml;ber einem Tag nichts gemeldet &ndash; l&auml;uft sie noch? (Im Zweifel Claude im Chat fragen.)</div>';
    const ms = ghStatus.meilensteine || {};
    const mk = Object.keys(ms);
    if (mk.length) h += '<div style="margin:6px 0">' + mk.map(k =>
      '<span style="display:inline-block;margin:2px 4px 2px 0;border-radius:9px;padding:2px 9px;font-size:11.5px;font-weight:700;'
      + (String(ms[k]) === 'erreicht' ? 'background:#dff0e2;color:#2f8a4c' : 'background:#eef1f5;color:#666')
      + '">' + esc(k) + ': ' + esc(String(ms[k])) + '</span>').join('') + '</div>';
    if (Array.isArray(ghStatus.phasen) && ghStatus.phasen.length) {
      h += '<table class="ph-tab"><tr><th>Phase</th><th>erledigt</th><th>offen</th><th>blockiert</th></tr>';
      ghStatus.phasen.forEach(p => {
        h += '<tr><td>' + esc(String(p.nr != null ? p.nr : '')) + '</td><td>' + (+p.erledigt || 0) + '</td><td>' + (+p.offen || 0) + '</td>'
          + '<td' + ((+p.blockiert || 0) ? ' style="color:#a33;font-weight:700"' : '') + '>' + (+p.blockiert || 0) + '</td></tr>';
      });
      h += '</table>';
    }
  } else if (!(state.statusUrl || '').trim()) {
    h += '<div style="font-size:12px;color:var(--muted)">Raw-URL der status.json eintragen (&ouml;ffentliches Repo, kein Token n&ouml;tig). Wird beim &Ouml;ffnen des Dashboards und per Knopf gelesen. Enth&auml;lt nur Task-Titel und Status, nie Inhalte.</div>';
  }
  h += '</div>';

  /* T-020: Befragungen – Umfragen an Anspruchsgruppen, Rücklauf pro Person, Auswertung pro Gruppe */
  h += '<div class="dash-sec"><h3>Befragungen <span style="font-weight:400;color:var(--muted);font-size:11px">Umfragen und Interviews an Anspruchsgruppen &ndash; Versand bleibt immer dein Handklick</span></h3>';
  h += '<div class="btnrow" style="margin:4px 0"><button class="go" id="befNeu" style="font-size:12px">+ Neue Befragung an Anspruchsgruppen</button>'
    + ((state.befragungen || []).length ? '<button id="befRefresh" style="font-size:12px">&#8635; R&uuml;cklauf aktualisieren</button>' : '') + '</div>';
  if (!(state.befragungen || []).length) {
    h += '<div style="font-size:12px;color:var(--muted)">Noch keine Befragung. Tipp: Zuerst auf Anspruchsgruppen-Karten (Doppelklick) Personen mit Mail hinterlegen &ndash; dann hier die Befragung starten. Auch der Fragekatalog kann seine offenen Fragen direkt als Umfrage hierher legen.</div>';
  }
  (state.befragungen || []).forEach((bef, bi) => {
    const pers = befPersonen(bef);
    const rows = befCache[bef.umfrageId];
    const geladen = Array.isArray(rows);
    const nAntw = geladen ? rows.length : null;
    const fristUm = bef.frist && isOverdue(bef.frist);
    h += '<div style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0">'
      + '<div style="font-size:13px"><b>' + esc(bef.titel) + '</b> <span style="color:var(--muted);font-size:11px">' + esc(bef.erstellt || '') + (bef.quelle === 'fragekatalog' ? ' &middot; aus dem Fragekatalog' : '') + '</span>'
      + (bef.frist ? ' <span style="font-size:11px;' + (fristUm ? 'color:#a33;font-weight:700' : 'color:var(--muted)') + '">Frist ' + fmtDue(bef.frist) + (fristUm ? ' &#9888;' : '') + '</span>' : '')
      + (nAntw !== null ? ' <span style="background:#dff0e2;color:#2f8a4c;border-radius:9px;padding:0 8px;font-size:11px;font-weight:700">' + nAntw + ' Antwort(en)'
        + (pers.length ? ' &middot; ' + pers.filter(p => befHatGeantwortet(bef, p.name)).length + '/' + pers.length + ' geantwortet' : '') + '</span>' : '')
      + '<button class="bef-del" data-bi="' + bi + '" style="float:right;font-size:11px;padding:1px 7px">&#10005;</button></div>'
      + '<div class="btnrow" style="margin:5px 0 2px"><button class="bef-link" data-bi="' + bi + '" style="font-size:11.5px">&#128279; Link kopieren</button>'
      + '<button class="bef-grp" data-bi="' + bi + '" style="font-size:11.5px">&#128101; Gruppen zuordnen (' + (bef.gruppen || []).length + ')</button>'
      + (geladen && nAntw ? '<button class="bef-aus" data-bi="' + bi + '" style="font-size:11.5px">&#128202; Auswertung pro Gruppe</button>' : '')
      + (geladen && nAntw && bef.fkRound ? '<button class="bef-fk" data-bi="' + bi + '" style="font-size:11.5px">&#8617; In Fragekatalog einarbeiten</button>' : '') + '</div>';
    if (pers.length) {
      h += '<table class="ph-tab"><tr><th>Person</th><th>Gruppe</th><th>Stand</th><th>Aktionen</th></tr>';
      pers.forEach(p => {
        const am = befHatGeantwortet(bef, p.name);
        const angenommen = bef.annahmen && bef.annahmen[p.name];
        const stand = am ? '<span style="color:#2f8a4c;font-weight:700">&#10003; geantwortet ' + fmtDue(am) + '</span>'
          : angenommen ? '<span style="color:var(--muted)">Annahme dokumentiert ' + fmtDue(angenommen) + '</span>'
          : fristUm ? '<span style="color:#a33;font-weight:700">&#9888; ausstehend (Frist vorbei)</span>'
          : geladen ? 'ausstehend' : '<span style="color:var(--muted)">&ndash; R&uuml;cklauf noch nicht geladen &ndash;</span>';
        let akt = '';
        if (!am) {
          if (p.mail) akt += '<a href="' + befMailHref(bef, p) + '"><button style="font-size:11px;padding:2px 7px">&#9993; Entwurf</button></a> ';
          akt += '<button class="bef-plink" data-bi="' + bi + '" data-pn="' + esc(p.name) + '" style="font-size:11px;padding:2px 7px">&#128279;</button> ';
          akt += '<button class="bef-ics" data-bi="' + bi + '" data-pn="' + esc(p.name) + '" style="font-size:11px;padding:2px 7px" title="Termin-Einladung (.ics) mit den Fragen als Traktanden">&#128197;</button> ';
          if (fristUm && !angenommen) {
            if (p.mail) akt += '<a href="' + befErinnerungHref(bef, p) + '"><button style="font-size:11px;padding:2px 7px">&#9993; Erinnerung</button></a> ';
            akt += '<button class="bef-ann" data-bi="' + bi + '" data-pn="' + esc(p.name) + '" style="font-size:11px;padding:2px 7px" title="Keine Antwort = wir arbeiten mit unseren Annahmen weiter (wird festgehalten)">Annahme festhalten</button>';
          }
        }
        h += '<tr><td>' + esc(p.name) + (p.rolle ? ' <span style="color:var(--muted);font-size:11px">(' + esc(p.rolle) + ')</span>' : '') + '</td>'
          + '<td style="font-size:11.5px">' + esc(p.gruppe) + '</td><td style="font-size:11.5px">' + stand + '</td><td>' + (akt || '&ndash;') + '</td></tr>';
      });
      h += '</table>';
    } else {
      h += '<div style="font-size:11.5px;color:var(--muted)">Keine Personen zugeordnet &ndash; &uuml;ber &laquo;Gruppen zuordnen&raquo; Anspruchsgruppen w&auml;hlen (Personen vorher auf der Karte hinterlegen). Der Link oben funktioniert auch ohne Zuordnung.</div>';
    }
    h += '</div>';
  });
  h += '</div>';

  const todos = [];
  state.postits.forEach(c => (Array.isArray(c.todos) ? c.todos : []).forEach((t, j) => todos.push({ c, t, j })));
  if (todos.length) {
    const tdone = todos.filter(x => x.t.done).length;
    const showWer = !state.solo;
    const persons = showWer ? [...new Set(todos.map(x => (x.t.wer || '').trim()).filter(Boolean))].sort() : [];
    const filt = showWer && todoWerFilter && persons.includes(todoWerFilter) ? todoWerFilter : '';
    const shown = filt ? todos.filter(x => (x.t.wer || '').trim() === filt) : todos;
    h += '<div class="dash-sec"><h3>Prozess-Aufgaben <span class="cnt" style="font-weight:400;color:var(--muted);font-size:11px">' + tdone + ' von ' + todos.length + ' erledigt &middot; Punkt anklicken = abhaken</span>'
      + '<span class="add" style="border:none;background:none;padding:0"><button id="dashOwner" style="font:inherit;font-size:11px;cursor:pointer;border:1px solid var(--accent);color:var(--accent);border-radius:6px;background:#eef4fb;padding:3px 9px">&#128101; Alle Verantwortlichkeiten zuteilen</button></span>'
      + (persons.length ? '<span class="add" style="border:none;background:none;padding:0"><select id="todoWerFilter" style="font:inherit;font-size:11px;padding:3px 6px;border:1px solid var(--line);border-radius:6px"><option value="">Alle Personen</option>'
        + persons.map(n => '<option' + (n === filt ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select></span>' : '')
      + '</h3>'
      + '<table class="ph-tab"><tr><th style="width:26px"></th><th>Aufgabe</th>' + (showWer ? '<th>Wer</th>' : '') + '<th>Post-it</th><th>Phase</th><th>Verantwortlich <span style="font-weight:400;color:var(--muted);font-size:10px">(gilt f&uuml;rs Post-it)</span></th></tr>';
    shown.forEach(x => {
      const vor = ownerVorschlag(x.c), gesetzt = (x.c.owner || '').trim();
      h += '<tr><td><div class="tk-dot ' + (x.t.done ? 'erledigt' : '') + '" data-tcid="' + x.c.id + '" data-tj="' + x.j + '" style="cursor:pointer;width:15px;height:15px;border-radius:50%;border:2px solid ' + (x.t.done ? '#2f8a4c;background:#2f8a4c' : '#cfd5dd') + '"></div></td>'
        + '<td' + (x.t.done ? ' style="text-decoration:line-through;color:var(--muted)"' : '') + '>' + esc(x.t.t) + '</td>'
        + (showWer ? '<td>' + (x.t.wer ? '<span style="background:#e3ecf7;border-radius:9px;padding:1px 8px;font-size:11px">' + esc(x.t.wer) + '</span>' : '<span style="color:var(--muted)">–</span>') + '</td>' : '')
        + '<td style="color:var(--muted)">' + esc(cleanTxt(x.c.text).slice(0, 44)) + '</td>'
        + '<td>' + (phaseIndexOfX(x.c.x) + 1) + '</td>'
        + '<td>' + ownerSelect('dow_' + x.c.id + '_' + x.j, gesetzt, 'dash-ow', x.c.id)
        + (gesetzt ? '' : '<div style="font-size:10px;color:var(--muted)">Vorschlag: ' + ownerKurz(vor) + '</div>') + '</td></tr>';
    });
    h += '</table>' + (filt ? '<div style="font-size:11px;color:var(--muted);margin-top:4px">Gefiltert nach «' + esc(filt) + '» – ' + shown.length + ' Aufgabe(n).</div>' : '') + '</div>';
  }

  h += '<div class="dash-sec"><h3>Phasen &middot; Fortschritt &middot; Verantwortliche &middot; Termine <span style="font-weight:400;color:var(--muted);font-size:11px">(Zeile anklicken = Phasen-Lupe)</span></h3>'
    + '<table class="ph-tab"><tr><th>Nr.</th><th>Phase</th><th>Fortschritt</th><th></th><th>Verantwortlich</th><th>Termin</th><th>Risiken</th><th>Entscheid-Tor</th></tr>';
  state.phases.forEach((p, i) => {
    const t = tasksOfPhase(i), d = t.filter(c => c.status === 'erledigt').length;
    const ppct = t.length ? Math.round(d / t.length * 100) : 0;
    const g = gateOfPhase(i);
    h += '<tr class="dash-row" data-pi="' + i + '"><td>' + (i+1) + '</td><td><b>' + esc(p.name) + '</b></td>'
      + '<td><div class="pbar"><div style="width:' + ppct + '%"></div></div></td><td style="white-space:nowrap">' + d + '/' + t.length + '</td>'
      + '<td>' + esc(p.wer || '–') + '</td><td>' + esc(p.wann || '–') + '</td>'
      + '<td>' + cardsInPhaseLane(i, 'reflexion').length + '</td>'
      + '<td class="gate-mini">' + (g ? '&#9670; ' + esc(g.label.split(/\s[–-]\sKriterien/)[0].slice(0, 48)) : '–') + '</td></tr>';
  });
  h += '</table></div>';

  h += '<div class="dash-sec"><h3>Aufgaben-Kanban <span style="font-weight:400;color:var(--muted);font-size:11px">(Karte anklicken = Status weiterschalten)</span></h3><div class="kan">';
  [['offen','Offen','k-offen'], ['arbeit','In Arbeit','k-arbeit'], ['erledigt','Erledigt','k-erledigt']].forEach(([st, lbl, cls]) => {
    const items = all.filter(t => (t.c.status||'offen') === st);
    h += '<div class="kan-col ' + cls + '"><h4>' + lbl + ' <span class="kc">' + items.length + '</span></h4>';
    items.forEach(t => {
      h += '<div class="kan-card" data-cid="' + t.c.id + '"><span class="kp">P' + (t.i+1) + ' · ' + esc(state.phases[t.i].name.slice(0,24)) + '</span><br>' + esc(cleanTxt(t.c.text).slice(0, 110)) + '</div>';
    });
    h += '</div>';
  });
  h += '</div><div class="kan-hint">Karten stammen von der Handlungsebene der Wand. Status-Änderungen hier erscheinen sofort auch auf der Wand und in der Lupe.</div></div>';

  body.innerHTML = h;
  const f = document.getElementById('todoWerFilter');
  if (f) f.onchange = () => { todoWerFilter = f.value; renderDash(); };
  /* V50: Verantwortlich-Auswahl direkt in der Aufgaben-Tabelle */
  body.querySelectorAll('.dash-ow').forEach(sel => { sel.onchange = () => {
    const c = getPostit(sel.dataset.owcid);
    if (c) { c.owner = sel.value.trim(); save(); render(); renderDash(); }
  }; });
  const ow = document.getElementById('dashOwner');
  if (ow) ow.onclick = () => { closeDash(); openOwnerModal(); };
  body.querySelectorAll('[data-ghok]').forEach(b => { b.onclick = () => ghEntscheid(b.dataset.ghok, true); });
  body.querySelectorAll('[data-ghno]').forEach(b => { b.onclick = () => ghEntscheid(b.dataset.ghno, false); });
  /* V53: Kritiker auf Abruf – genau dort, wo entschieden wird */
  body.querySelectorAll('[data-kritik]').forEach(b => { b.onclick = () => fragKritiker(wd[+b.dataset.kritik], b); });
  /* Befragungen (T-020) */
  const bn = document.getElementById('befNeu');
  if (bn) bn.onclick = openBefModal;
  const br = document.getElementById('befRefresh');
  if (br) br.onclick = async function () { this.textContent = '… lädt …'; try { await befLaden(); } catch (e) { sysMsg('❌ Rücklauf: ' + e.message, true); } renderDash(); };

/* ================================================================
   PHASEN-LUPE  – in eine Phase hineinzoomen & im Detail bearbeiten
   ================================================================ */
const STATUS_NEXT = { offen:'arbeit', arbeit:'erledigt', erledigt:'offen' };
const STATUS_LABEL = { offen:'offen', arbeit:'in Arbeit', erledigt:'erledigt' };
const LUPE_SECTIONS = [
  { lane:'handlung', title:'Aufgaben / Handlungen', add:'Aufgabe' },
  { lane:'doku',     title:'Ergebnisse / Dokumentation', add:'Ergebnis' },
  { lane:'sache',    title:'Zwischenziele', add:'Zwischenziel' },
  { lane:'reflexion',title:'Risiken & Reflexion', add:'Risiko' },
  { lane:'mgmt2',    title:'Projektleitung (Mgmt 2)', add:'Punkt' },
  { lane:'mgmt1',    title:'Bereichsleitung (Mgmt 1)', add:'Punkt' },
  { lane:'input',    title:'Experten / Input', add:'Experte' },
  { lane:'anspruch', title:'Anspruchsgruppen', add:'Gruppe' }
];
let lupeIdx = -1;

function phaseIndexOfX(x) { let acc = 0; for (let i = 0; i < state.phases.length; i++) { if (x < acc + state.phases[i].w) return i; acc += state.phases[i].w; } return state.phases.length - 1; }
function laneKeyOfY(y) { return LANE_KEYS[clamp(Math.floor(y / LANE_H), 0, LANES.length - 1)]; }
function cardsInPhaseLane(i, laneKey) { return state.postits.filter(p => phaseIndexOfX(p.x) === i && laneKeyOfY(p.y) === laneKey); }
function addCard(i, laneKey, text, status) {
  const li = LANE_KEYS.indexOf(laneKey), left = phaseLeft(i), w = state.phases[i].w;
  const n = cardsInPhaseLane(i, laneKey).length;
  const x = clamp(left + 12 + (n * 26) % Math.max(30, w - PI_W - 24), 0, canvasW(state) - PI_W);
  const y = li * LANE_H + 8 + (n * 20) % (LANE_H - 60);
  const card = { id: uid('p'), x, y, text: text || 'Neuer Eintrag', color: LANE_COLOR[laneKey] || PALETTE[0], status: status || 'offen' };
  state.postits.push(card); return card;
}

const lupe = document.getElementById('lupe'), lupeBody = document.getElementById('lupeBody');
function openLupe(i) {

  const eif = (k, lbl, full) => '<div class="' + (full?'full':'') + '"><label>' + lbl + '</label><textarea data-ei="' + k + '">' + esc(p[k]||'') + '</textarea></div>';
  let h = '<div class="lupe-tools">'
    + '<button class="lupe-tool" data-kind="schritte">&#129302; Schritte ergänzen</button>'

    + '<button class="lupe-tool" data-kind="zusammenfassung">&#129302; Phase zusammenfassen</button>'
    + '</div>';
  h += '<div id="lupeProp"></div>';
  h += '<div class="ei-grid">' + eif('ziel','Ziel der Phase', true) + eif('input','Input') + eif('output','Output / Ergebnis') + eif('wer','Wer?') + eif('was','Was?') + eif('wann','Wann?') + eif('wie','Wie?') + '</div>';
  if (gate.length) h += '<div style="font-size:12px;color:var(--warn);margin-top:6px">&#9670; Entscheid-Tor: ' + esc(gate.map(g=>g.label).join(' | ')) + '</div>';

  LUPE_SECTIONS.forEach(sec => {
    const cards = cardsInPhaseLane(i, sec.lane);
    h += '<div class="lupe-sec"><h3>' + esc(sec.title) + ' <span class="cnt">' + cards.length + '</span><span class="add" data-addlane="' + sec.lane + '">+ ' + sec.add + '</span></h3>';
    cards.forEach(c => {
      const st = c.status || 'offen';
      h += '<div class="tk' + (st==='erledigt'?' done':'') + '" data-id="' + c.id + '">'
        + '<div class="tk-dot ' + st + '" title="Status: ' + STATUS_LABEL[st] + '"></div>'
        + '<div class="tk-text" contenteditable="true" data-id="' + c.id + '">' + esc(c.text) + '</div>'
        + (c.doc ? '<button class="tk-doc" data-id="' + c.id + '" title="Ausarbeitung als Word herunterladen">&#128229;</button>' : '')
        + '<button class="tk-ai' + (Array.isArray(c.chat) && c.chat.length ? ' has' : '') + '" data-id="' + c.id + '" title="' + (Array.isArray(c.chat) && c.chat.length ? 'Gespeicherter KI-Dialog – aufklappen' : 'KI-Unterstützung') + '">&#129302;</button>'
        + '<button class="tk-del" data-id="' + c.id + '" title="löschen">&#10005;</button></div>';

/* KI-Text → sauber strukturiertes Dokument-HTML (Überschriften, Listen, Absätze) */
function textToDocHtml(t) {
  const lines = String(t || '').replace(/\r/g, '').split('\n');
  let html = '', list = null;
  const closeList = () => { if (list) { html += '</' + list + '>'; list = null; } };
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|\s)\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  lines.forEach(raw => {
    const l = raw.trim();
    if (!l) { closeList(); return; }
    let m;
    if ((m = l.match(/^#{1,3}\s+(.*)/))) { closeList(); html += '<h2>' + inline(m[1]) + '</h2>'; return; }
    if ((m = l.match(/^[-–•*]\s+(.*)/))) {
      if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
      html += '<li>' + inline(m[1]) + '</li>'; return;
    }
    if ((m = l.match(/^\d+(?:\.\d+)*\.\s+(.*)/))) {
      if (m[1].length <= 52) { closeList(); html += '<h2>' + inline(l) + '</h2>'; return; }
      if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; }
      html += '<li>' + inline(m[1]) + '</li>'; return;
    }
    if (l.length <= 64 && /:$/.test(l)) { closeList(); html += '<p style="margin:8pt 0 2pt"><b>' + inline(l) + '</b></p>'; return; }
    closeList(); html += '<p style="margin:3pt 0">' + inline(l) + '</p>';
  });
  closeList();
  return html;
}
function downloadCardDoc(id) {
  const c = getPostit(id); if (!c || !c.doc) return;
  const title = cleanTxt(c.text).slice(0, 60);
  downloadDoc((title || 'Ausarbeitung').replace(/[\\/:*?"<>|]/g, '-') + '.doc', docShell(title || 'Ausarbeitung', textToDocHtml(c.doc)));
}
